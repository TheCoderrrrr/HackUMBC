<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" width="980" height="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="A standard target-date fund uses only your retirement year and gives everyone that age the same plan. Adaptive Retirement combines cash flow, debt, emergency savings, employer match and retirement year into an affordable contribution, next-dollar priorities and a month-by-month projection.">
  <rect width="980" height="410" rx="16" fill="#0B1220"/>
  <text x="40" y="54" font-size="12" font-weight="600" letter-spacing="2" fill="#38BDF8">TARGET DATE FUND 2.0</text>
  <text x="40" y="88" font-size="26" font-weight="600" fill="#F8FAFC">Same retirement date. A plan that fits your finances.</text>
  <text x="40" y="114" font-size="14" fill="#64748B">The fund allocation stays the same. Contributions and cash priorities adapt to each person.</text>
  <rect x="40" y="140" width="280" height="240" rx="12" fill="none" stroke="#1E293B"/><text x="60" y="170" font-size="12" font-weight="600" letter-spacing="1.5" fill="#64748B">STANDARD TARGET-DATE FUND</text><rect x="95" y="200" width="170" height="36" rx="8" fill="#111A2E" stroke="#1E293B"/><text x="180.0" y="222.6" font-size="13" font-weight="500" fill="#E2E8F0" text-anchor="middle">Retirement year</text><line x1="180" y1="236" x2="180" y2="290" stroke="#64748B" stroke-width="1.5"/><path d="M175,284 L180,292 L185,284" fill="none" stroke="#64748B" stroke-width="1.5"/><rect x="70" y="296" width="220" height="44" rx="8" fill="#111A2E" stroke="#1E293B"/><text x="180.0" y="322.6" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">One plan for everyone that age</text>
  <text x="335" y="266" font-size="18" fill="#64748B" text-anchor="middle">→</text>
  <rect x="350" y="140" width="590" height="240" rx="12" fill="none" stroke="#38BDF8" stroke-opacity="0.45"/><text x="370" y="170" font-size="12" font-weight="600" letter-spacing="1.5" fill="#38BDF8">ADAPTIVE RETIREMENT</text><rect x="370" y="182" width="150" height="30" rx="8" fill="#111A2E" stroke="#1E293B"/><text x="445.0" y="201.4" font-size="12.5" font-weight="500" fill="#E2E8F0" text-anchor="middle">Cash flow</text><rect x="370" y="220" width="150" height="30" rx="8" fill="#111A2E" stroke="#1E293B"/><text x="445.0" y="239.4" font-size="12.5" font-weight="500" fill="#E2E8F0" text-anchor="middle">Debt and APRs</text><rect x="370" y="258" width="150" height="30" rx="8" fill="#111A2E" stroke="#1E293B"/><text x="445.0" y="277.4" font-size="12.5" font-weight="500" fill="#E2E8F0" text-anchor="middle">Emergency savings</text><rect x="370" y="296" width="150" height="30" rx="8" fill="#111A2E" stroke="#1E293B"/><text x="445.0" y="315.4" font-size="12.5" font-weight="500" fill="#E2E8F0" text-anchor="middle">Employer match</text><rect x="370" y="334" width="150" height="30" rx="8" fill="#111A2E" stroke="#1E293B"/><text x="445.0" y="353.4" font-size="12.5" font-weight="500" fill="#E2E8F0" text-anchor="middle">Retirement year</text><path d="M520,197.0 C544.0,197.0 544.0,274.0 568,274.0" fill="none" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" dur="1.6s" begin="0.0s" repeatCount="indefinite" values="20;0"/></path><path d="M520,235.0 C544.0,235.0 544.0,274.0 568,274.0" fill="none" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" dur="1.6s" begin="0.15s" repeatCount="indefinite" values="20;0"/></path><path d="M520,273.0 C544.0,273.0 544.0,274.0 568,274.0" fill="none" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" dur="1.6s" begin="0.3s" repeatCount="ind