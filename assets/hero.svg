      <animateTransform attributeName="gradientTransform" type="translate" dur="6s" repeatCount="indefinite" values="-0.3 0;0.3 0;-0.3 0"/>
    </linearGradient>
    <linearGradient id="fillA" x1="0" y1="0" x2="0" y2="1">
