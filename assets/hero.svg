<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="A target-date fund plans from your birth year alone, so everyone that age gets the same plan. Adaptive Retirement Management (ARM) uses your income, debt, savings and employer match to show how much to save, where it goes and what it builds.">
  <defs>
    <style>
  .block { opacity: 0; animation: rise 9s cubic-bezier(.2,.7,.2,1) infinite both; }
  .lift { transition: transform .25s ease, filter .25s ease; }
  .lift:hover { transform: translateY(-6px); filter: brightness(1.25) drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  @keyframes rise {
    0%   { opacity: 0; transform: translateY(16px); }
    9%   { opacity: 1; transform: translateY(0); }
    88%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-8px); }
  }
  .joint circle.ring { animation: pulse 9s ease-out infinite both; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse {
    0%, 100% { opacity: 0; transform: scale(1); }
    4%  { opacity: .9; transform: scale(1); }
    14% { opacity: 0; transform: scale(1.9); }
  }
  .glow { animation: breathe 3s ease-in-out infinite; }
  .step { animation: step 2.7s ease-in-out infinite both; }
  @keyframes step { 0%, 45%, 100% { opacity: .55; filter: none; }
                    15%, 30% { opacity: 1; filter: drop-shadow(0 0 5px currentColor) brightness(1.3); } }
  .halo { animation: halo 5s ease-in-out infinite; }
  @keyframes halo { 0%, 100% { opacity: .35; } 25% { opacity: .8; } }
  @keyframes breathe { 0%, 100% { opacity: .25; } 50% { opacity: .6; } }
  @media (prefers-reduced-motion: reduce) {
    .block { animation: none; opacity: 1; } .joint circle.ring, .glow, .halo, .step { animation: none; }
  }
</style>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="halo" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/><stop offset="0.42" stop-color="#F8FAFC"/>
      <stop offset="0.5" stop-color="#BAE6FD"/><stop offset="0.58" stop-color="#F8FAFC"/><stop offset="1" stop-color="#F8FAFC"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-850 0;850 0;850 0"
        keyTimes="0;0.45;1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="980" height="400" rx="16" fill="#0B1220"/>
  <text x="40" y="56" font-size="15" font-weight="600" letter-spacing="2.5" fill="#38BDF8">TARGET DATE FUND 2.0 <tspan fill="#7C8BA1">—</tspan> THE FUTURE OF RETIREMENT PLANNING</text>
  <text x="40" y="116" font-size="48" font-weight="700" fill="#38BDF8" filter="url(#halo)" class="halo">Same fund. A plan that fits you.</text>
  <text x="40" y="116" font-size="48" font-weight="700" fill="url(#sheen)">Same fund. A plan that fits you.</text>
  <rect x="28" y="140" width="224" height="232" rx="14" fill="#1A0E14" stroke="#F87171" stroke-opacity="0.35"/><text x="40" y="164" font-size="15" font-weight="700" letter-spacing="1.5" fill="#F87171">TARGET-DATE FUND</text><line x1="140" y1="248" x2="140" y2="304" stroke="#F87171" stroke-opacity="0.5" stroke-width="1.5"/><g class="block" style="animation-delay:0.00s"><g class="lift"><rect x="40" y="196" width="200" height="52" rx="10" fill="#2A1218" stroke="#F87171"/><text x="140.0" y="227.9" font-size="17" font-weight="600" fill="#FECACA" text-anchor="middle">Birth year</text></g></g><g class="joint" transform="translate(140,276) rotate(90)"><circle class="ring" r="15" fill="none" stroke="#F87171" stroke-width="1.5" style="animation-delay:0.25s"/><circle r="15" fill="#1A0E14" stroke="#F87171" stroke-width="1.5"/><path d="M-6,0 H6 M1.5,-5 L6.5,0 L1.5,5" fill="none" stroke="#F87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g class="block" style="animation-delay:0.40s"><g class="lift"><rect x="40" y="304" width="200" height="52" rx="10" fill="#2A1218" stroke="#F87171"/><text x="140.0" y="335.9" font-size="17" font-weight="600" fill="#FECACA" text-anchor="middle">Same plan for all</text></g></g>
  <rect x="288" y="140" width="664" height="232" rx="14" fill="#0B1A2F" stroke="#38BDF8" stroke-opacity="0.35"/><text x="304" y="164" font-size="15" font-weight="700" letter-spacing="1.5" fill="#38BDF8">ARM</text><path d="M444,200.0 C464.5,200.0 464.5,272 485,272" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/><path d="M444,248.0 C464.5,248.0 464.5,272 485,272" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/><path d="M444,296.0 C464.5,296.0 464.5,272 485,272" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/><path d="M444,344.0 C464.5,344.0 464.5,272 485,272" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/><line x1="515" y1="272" x2="540" y2="272" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/><line x1="690" y1="272" x2="715" y2="272" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M745,272 C757.5,272 757.5,212.0 770,212.0" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/><path d="M745,272 C757.5,272 757.5,272.0 770,272.0" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/><path d="M745,272 C757.5,272 757.5,332.0 770,332.0" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/><g class="block" style="animation-delay:0.60s"><g class="lift"><rect x="304" y="180" width="140" height="40" rx="10" fill="#1D4E89" stroke="#60A5FA"/><text x="374.0" y="205.9" font-size="17" font-weight="600" fill="#F8FAFC" text-anchor="middle">Income</text></g></g><g class="block" style="animation-delay:0.72s"><g class="lift"><rect x="304" y="228" width="140" height="40" rx="10" fill="#1D4E89" stroke="#60A5FA"/><text x="374.0" y="253.9" font-size="17" font-weight="600" fill="#F8FAFC" text-anchor="middle">Debt</text></g></g><g class="block" style="animation-delay:0.84s"><g class="lift"><rect x="304" y="276" width="140" height="40" rx="10" fill="#1D4E89" stroke="#60A5FA"/><text x="374.0" y="301.9" font-size="17" font-weight="600" fill="#F8FAFC" text-anchor="middle">Savings</text></g></g><g class="block" style="animation-delay:0.96s"><g class="lift"><rect x="304" y="324" width="140" height="40" rx="10" fill="#1D4E89" stroke="#60A5FA"/><text x="374.0" y="349.9" font-size="17" font-weight="600" fill="#F8FAFC" text-anchor="middle">Match</text></g></g><g class="block" style="animation-delay:1.25s"><g class="step" style="animation-delay:0.0s;color:#22D3EE"><rect x="492.0" y="200" width="66" height="26" rx="13" fill="#22D3EE" fill-opacity="0.16" stroke="#22D3EE" stroke-width="1.2"/><text x="525.0" y="217.5" font-size="12.5" font-weight="600" fill="#22D3EE" text-anchor="middle">Analyze</text></g><path d="M563.0,209 L568.0,213 L563.0,217" fill="none" stroke="#7C8BA1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g class="step" style="animation-delay:0.9s;color:#A78BFA"><rect x="574.0" y="200" width="82" height="26" rx="13" fill="#A78BFA" fill-opacity="0.16" stroke="#A78BFA" stroke-width="1.2"/><text x="615.0" y="217.5" font-size="12.5" font-weight="600" fill="#A78BFA" text-anchor="middle">Prioritize</text></g><path d="M661.0,209 L666.0,213 L661.0,217" fill="none" stroke="#7C8BA1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g class="step" style="animation-delay:1.8s;color:#34D399"><rect x="672.0" y="200" width="66" height="26" rx="13" fill="#34D399" fill-opacity="0.16" stroke="#34D399" stroke-width="1.2"/><text x="705.0" y="217.5" font-size="12.5" font-weight="600" fill="#34D399" text-anchor="middle">Project</text></g><line x1="615.0" y1="228" x2="615.0" y2="238" stroke="#FBBF24" stroke-opacity="0.6" stroke-dasharray="2 3"/></g><g class="joint" transform="translate(500,272) rotate(0)"><circle class="ring" r="15" fill="none" stroke="#38BDF8" stroke-width="1.5" style="animation-delay:1.15s"/><circle r="15" fill="#0B1A2F" stroke="#38BDF8" stroke-width="1.5"/><path d="M-6,0 H6 M1.5,-5 L6.5,0 L1.5,5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g class="block" style="animation-delay:1.35s"><g class="lift"><rect class="glow" x="534" y="236" width="162" height="72" rx="16" fill="none" stroke="#FBBF24" stroke-width="6" filter="url(#soft)"/><rect x="540" y="242" width="150" height="60" rx="10" fill="#FBBF24" stroke="#FBBF24"/><text x="615.0" y="278.6" font-size="19" font-weight="700" fill="#1A1204" text-anchor="middle">Your plan</text></g></g><g class="joint" transform="translate(730,272) rotate(0)"><circle class="ring" r="15" fill="none" stroke="#38BDF8" stroke-width="1.5" style="animation-delay:1.60s"/><circle r="15" fill="#0B1A2F" stroke="#38BDF8" stroke-width="1.5"/><path d="M-6,0 H6 M1.5,-5 L6.5,0 L1.5,5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g class="block" style="animation-delay:1.80s"><g class="lift"><rect x="770" y="188.0" width="168" height="48" rx="10" fill="#0B6FA4" stroke="#7DD3FC"/><text x="854.0" y="217.9" font-size="17" font-weight="600" fill="#F8FAFC" text-anchor="middle">How much to save</text></g></g><g class="block" style="animation-delay:1.92s"><g class="lift"><rect x="770" y="248.0" width="168" height="48" rx="10" fill="#0B6FA4" stroke="#7DD3FC"/><text x="854.0" y="277.9" font-size="17" font-weight="600" fill="#F8FAFC" text-anchor="middle">Where it goes</text></g></g><g class="block" style="animation-delay:2.04s"><g class="lift"><rect x="770" y="308.0" width="168" height="48" rx="10" fill="#0B6FA4" stroke="#7DD3FC"/><text x="854.0" y="337.9" font-size="17" font-weight="600" fill="#F8FAFC" text-anchor="middle">What it builds</text></g></g>
