<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Morgan, 35, owes $18,000 on a 25% APR card. With current habits the card is paid off in month 135; the adaptive plan pays it off in month 16, saves $32,516 in interest and adds $141,669 at retirement.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset="0.55" stop-color="#0B1B3F"/><stop offset="1" stop-color="#2E1065"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.25" cy="0.9" r="0.6">
