<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="A target-date fund plans from your birth year alone, so everyone that age gets the same plan. Adaptive Retirement uses your income, debt, savings and employer match to show how much to save, where it goes and what it builds.">
